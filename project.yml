name: SchoolSchedule
options:
  bundleIdPrefix: com.sociofriend.dasacucak
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: hy
  createIntermediateGroups: true
  # Marks the project as upgraded (LastUpgradeCheck), so Xcode stops offering "Update to recommended settings".
  xcodeVersion: "27.0"
settings:
  base:
    # Armenian-only app: don't auto-extract or rewrite Localizable.xcstrings on build.
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZATION_EXPORT_SUPPORTED: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    DEVELOPMENT_TEAM: 52BY9G622H
    BUNDLE_ID_BASE: com.sociofriend.dasacucak
    APP_GROUP_ID: group.$(BUNDLE_ID_BASE)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    # Xcode's recommended settings, adopted here instead of in the generated project.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    DEAD_CODE_STRIPPING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
packages:
  SwiftyTesseract:
    url: https://github.com/SwiftyTesseract/SwiftyTesseract
    exactVersion: 4.0.1
targets:
  SchoolSchedule:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # Folder reference (blue): SwiftyTesseract looks for Bundle.main/tessdata
      - path: Resources/tessdata
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Դասացուցակ
        CFBundleLocalizations: [hy]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Shared tasks/timetables: `.dasacucak` files open in the app (ShareInboxView).
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Դասացուցակի ֆայլ
            LSHandlerRank: Owner
            LSItemContentTypes: [am.dasacucak.share]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: am.dasacucak.share
            UTTypeDescription: Դասացուցակի ֆայլ
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dasacucak]
        NSCameraUsageDescription: Տեսախցիկն անհրաժեշտ է դասացուցակը և գրատախտակը լուսանկարելու համար։
    entitlements:
      path: App/SchoolSchedule.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconBackpack AppIconLetter AppIconScan AppIconClock AppIconGraphite AppIconMidnight AppIconNeon AppIconSand AppIconEmerald
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SchoolScheduleWidget
      - package: SwiftyTesseract
  SchoolScheduleWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Դասացուցակ
        CFBundleLocalizations: [hy]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/SchoolScheduleWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widget
  SchoolScheduleTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SchoolSchedule
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SchoolSchedule:
    build:
      targets:
        SchoolSchedule: all
        SchoolScheduleWidget: all
    test:
      targets: [SchoolScheduleTests]
